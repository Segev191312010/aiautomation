# Disposable, isolated Compose gate.  This file is deliberately an override:
# it never imports a developer .env file, uses no fixed container/network names,
# and leaves resource naming to the Compose project selected by the smoke runner.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    environment:
      IS_PAPER: "true"
      SIM_MODE: "true"
      MOCK_MODE: "true"
      WORKERS: "1"
      DB_PATH: /data/trading_bot.db
      DASHBOARD_BUILD_DIR: ./dashboard/dist
      RUNTIME_LOCK_PATH: /runtime/tradebot-runtime.lock
      LOG_LEVEL: warning
      TRADEBOT_TRUST_PROXY_HEADERS: "true"
    volumes:
      - test-trading-data:/data
      - test-runtime-lock:/runtime
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1::80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  test-trading-data:
  test-runtime-lock:
