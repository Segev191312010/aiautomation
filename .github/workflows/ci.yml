name: CI

on:
  push:
    branches: [master, integration/post-reconciliation]
  pull_request:
    branches: [master, integration/post-reconciliation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact_head:
    name: P1-T2 / exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      base_sha: ${{ steps.provenance.outputs.base_sha }}
      head_sha: ${{ steps.provenance.outputs.head_sha }}
      parent_sha: ${{ steps.provenance.outputs.parent_sha }}
      run_attempt: ${{ steps.provenance.outputs.run_attempt }}
      run_url: ${{ steps.provenance.outputs.run_url }}
      tested_sha: ${{ steps.provenance.outputs.tested_sha }}
      tree_sha: ${{ steps.provenance.outputs.tree_sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Record exact-head provenance
        id: provenance
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          parent_sha="$(git rev-parse 'HEAD^1' 2>/dev/null || true)"
          changed_path_count=0
          if [ -n "$parent_sha" ]; then
            while IFS= read -r -d '' _; do
              changed_path_count=$((changed_path_count + 1))
            done < <(git diff --name-only -z "$parent_sha" "$tested_sha")
          fi
          test "$tested_sha" = "$EXPECTED_HEAD_SHA"
          {
            echo "base_sha=$BASE_SHA"
            echo "head_sha=$EXPECTED_HEAD_SHA"
            echo "parent_sha=$parent_sha"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "run_url=$RUN_URL"
            echo "tested_sha=$tested_sha"
            echo "tree_sha=$tree_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Exact-head provenance"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested SHA | \`$tested_sha\` |"
            echo "| Tree SHA | \`$tree_sha\` |"
            echo "| First parent | \`$parent_sha\` |"
            echo "| Base SHA | \`$BASE_SHA\` |"
            echo "| Run | $RUN_URL |"
            echo "| Attempt | $RUN_ATTEMPT |"
            echo "| Tip-only changed path count | $changed_path_count |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend virtual environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Confirm Docker engine
        run: docker version

      - name: Enforce host database path
        run: scripts/check_db_path.sh --host

      - name: Run all six quality gates on exact head
        run: scripts/run_quality_gates.sh

      - name: Verify both image guards
        run: |
          set -euo pipefail
          for image in trading-backend:gate trading-fullstack:gate; do
            docker run --rm --entrypoint ./scripts/check_db_path.sh "$image" --docker
            if docker run --rm -e DB_PATH=/tmp/wrong.db --entrypoint ./scripts/check_db_path.sh "$image" --docker; then
              echo "$image accepted an invalid DB_PATH" >&2
              exit 1
            fi
          done

  merge_ref:
    name: P1-T2 / merge-ref
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      base_sha: ${{ steps.provenance.outputs.base_sha }}
      head_sha: ${{ steps.provenance.outputs.head_sha }}
      merge_sha: ${{ steps.provenance.outputs.merge_sha }}
      run_attempt: ${{ steps.provenance.outputs.run_attempt }}
      run_url: ${{ steps.provenance.outputs.run_url }}
      tree_sha: ${{ steps.provenance.outputs.tree_sha }}

    steps:
      - name: Checkout synthetic merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record merge-ref provenance
        id: provenance
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          parents="$(git show -s --format=%P HEAD)"
          changed_path_count=0
          while IFS= read -r -d '' _; do
            changed_path_count=$((changed_path_count + 1))
          done < <(git diff --name-only -z "$PR_BASE_SHA...$PR_HEAD_SHA")
          test "$actual_sha" = "$EXPECTED_MERGE_SHA"
          git merge-base --is-ancestor "$PR_HEAD_SHA" "$actual_sha"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$actual_sha"
          {
            echo "base_sha=$PR_BASE_SHA"
            echo "head_sha=$PR_HEAD_SHA"
            echo "merge_sha=$actual_sha"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "run_url=$RUN_URL"
            echo "tree_sha=$tree_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Merge-ref provenance"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tested merge SHA | \`$actual_sha\` |"
            echo "| Merge tree SHA | \`$tree_sha\` |"
            echo "| PR head SHA | \`$PR_HEAD_SHA\` |"
            echo "| PR base SHA | \`$PR_BASE_SHA\` |"
            echo "| Merge parents | \`$parents\` |"
            echo "| Run | $RUN_URL |"
            echo "| Attempt | $RUN_ATTEMPT |"
            echo "| PR changed path count | $changed_path_count |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Create backend virtual environment
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Confirm Docker engine
        run: docker version

      - name: Enforce host database path
        run: scripts/check_db_path.sh --host

      - name: Run all six quality gates on merge ref
        run: scripts/run_quality_gates.sh

      - name: Verify both image guards
        run: |
          set -euo pipefail
          for image in trading-backend:gate trading-fullstack:gate; do
            docker run --rm --entrypoint ./scripts/check_db_path.sh "$image" --docker
            if docker run --rm -e DB_PATH=/tmp/wrong.db --entrypoint ./scripts/check_db_path.sh "$image" --docker; then
              echo "$image accepted an invalid DB_PATH" >&2
              exit 1
            fi
          done

  quality_gates:
    name: P1-T2 / quality-gates
    if: ${{ always() }}
    needs: [exact_head, merge_ref]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish aggregate result
        env:
          BASE_SHA: ${{ needs.merge_ref.outputs.base_sha || needs.exact_head.outputs.base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXACT_HEAD_RESULT: ${{ needs.exact_head.result }}
          HEAD_SHA: ${{ needs.exact_head.outputs.tested_sha }}
          MERGE_REF_RESULT: ${{ needs.merge_ref.result }}
          MERGE_SHA: ${{ needs.merge_ref.outputs.merge_sha }}
          RUN_ATTEMPT: ${{ needs.exact_head.outputs.run_attempt }}
          RUN_URL: ${{ needs.exact_head.outputs.run_url }}
        run: |
          set -euo pipefail
          {
            echo "### P1-T2 quality result"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Event | $EVENT_NAME |"
            echo "| Exact-head result | $EXACT_HEAD_RESULT |"
            echo "| Exact tested SHA | \`$HEAD_SHA\` |"
            echo "| Merge-ref result | $MERGE_REF_RESULT |"
            echo "| Base SHA | \`$BASE_SHA\` |"
            echo "| Merge tested SHA | \`${MERGE_SHA:-not-applicable}\` |"
            echo "| Run | $RUN_URL |"
            echo "| Attempt | $RUN_ATTEMPT |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$EXACT_HEAD_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$MERGE_REF_RESULT" = "success"
          fi

  backend_compatibility:
    name: Backend (Python + pytest)
    if: ${{ always() }}
    needs: [quality_gates]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve protected-master backend context
        env:
          RESULT: ${{ needs.quality_gates.result }}
        run: test "$RESULT" = "success"

  dashboard_compatibility:
    name: Dashboard (TypeScript + Vite + Vitest)
    if: ${{ always() }}
    needs: [quality_gates]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve protected-master dashboard context
        env:
          RESULT: ${{ needs.quality_gates.result }}
        run: test "$RESULT" = "success"
