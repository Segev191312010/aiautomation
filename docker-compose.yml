services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      APP_ENV: "development"
      DB_PATH: "/data/autotrader_v1.db"
      STRICT_CONFIG: "true"
    expose:
      - "8000"
    volumes:
      - autotrader-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  autotrader-data:
